services:
  - type: web
    name: wallet-app
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: wallet-data
      mountPath: /data
      sizeGB: 1
