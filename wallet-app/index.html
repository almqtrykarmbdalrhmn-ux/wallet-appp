<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d4af37">
<title>محفظتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0206;--card:#201418;--head:#26282b;--line:#3a2a31;--acc:#f5d77a;--acc2:#d4af37;--on:#241a00;--txt:#f4ece6;--mute:#9b8b92;--ok:#1fdc7a;--bad:#ff4a2a;--b1:#3a3a3e;--b2:#4a0f22;--fs:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:var(--fs)/1.6 Cairo,system-ui,sans-serif}
#app{max-width:520px;margin:auto;padding:0 14px 110px}
.g{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.gt{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:.3em 0;color:var(--acc);text-align:center}
input,select,textarea{width:100%;padding:15px 18px;margin:6px 0;border-radius:26px;border:1px solid var(--line);background-color:var(--inp,color-mix(in srgb,var(--bg) 70%,#000));color:var(--txt);font:inherit;text-align:center}
input[type=color]{padding:2px;height:44px;border-radius:12px}input[type=checkbox]{width:22px;height:22px;margin:0}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:26px;padding:15px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);width:100%;box-shadow:0 6px 18px color-mix(in srgb,var(--acc2) 25%,transparent)}
button.ghost{background:none;border:1px solid var(--acc);color:var(--acc);box-shadow:none}
button.sm{width:auto;padding:8px 18px}button.grn{background:#00875a;color:#fff}button.gry{background:#555;color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin:14px 0}
.dash{border:1px dashed var(--acc2);border-radius:20px;padding:14px;margin:12px 0;text-align:center}
.hd{background:var(--head);margin:0 -14px;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;display:flex;align-items:center;gap:12px}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;border:0;padding:0;box-shadow:none;flex:none}
.hd .nm{flex:1;font-weight:900;font-size:1.15em;line-height:1.3}.hd small{color:var(--mute);font-weight:400;display:block}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-inline-end:6px}
.ib{width:56px;height:56px;border-radius:18px;padding:0;font-size:24px;flex:none}.kb{background:none;color:var(--acc);box-shadow:none;width:30px;padding:0;font-size:26px}
.bc{background:linear-gradient(135deg,var(--b1),var(--b2));border:1px solid var(--line);border-radius:28px;margin:18px 0 12px;text-align:center;overflow:hidden}
.bc .p{padding:18px 10px 6px}.bc .num{font-size:1.7em;font-weight:900}.bc .bal{font-size:2em;font-weight:900;display:flex;justify-content:center;align-items:center;gap:10px}
.bc .bar{background:#0003;display:flex;justify-content:space-around;align-items:center;padding:14px;font-weight:700;margin-top:10px}
.bar button{background:none;color:var(--txt);box-shadow:none;width:auto;padding:4px 10px}.qr{background:#fff!important;color:#000!important;border-radius:14px!important;font-size:34px;line-height:1;padding:10px!important}
.eye{background:none;box-shadow:none;width:auto;padding:0;font-size:1.2em}
.promo{border:1px dashed #2f8fe8;background:#0b1830;color:#2f9bff;border-radius:20px;padding:14px;text-align:center;font-weight:700;margin:12px 0}
.back{width:auto;padding:10px 22px;margin:6px 0 10px;display:block;margin-inline-start:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:22px;padding:18px 4px;font-size:.95em;box-shadow:none}.tile span{display:block;font-size:2em}
.tile.hl{color:var(--acc)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pk{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:0 12px 14px;text-align:center;position:relative;overflow:hidden;box-shadow:0 0 22px color-mix(in srgb,var(--acc2) 10%,transparent)}
.pk .sz{position:absolute;top:0;right:0;background:var(--acc);color:var(--on);font-weight:900;padding:6px 16px;border-radius:0 0 22px 0;font-style:normal}
.pk .off{position:absolute;top:0;left:0;background:var(--bad);color:#fff;font-weight:900;padding:6px 16px;border-radius:0 0 0 22px;font-style:normal;font-size:.9em}
.pk .pn{margin-top:50px;font-weight:900;display:flex;justify-content:center;gap:10px;align-items:center}
.st{background:none;box-shadow:none;color:#555;width:auto;padding:0;font-size:1.5em}.st.on{color:var(--acc)}
.avl{color:var(--ok);font-size:.9em;margin-top:6px}.old{color:var(--mute);text-decoration:line-through;margin:4px 0}.pr{font-size:1.6em;font-weight:900;color:var(--acc);margin-bottom:8px}
.pk input{padding:8px;margin:0 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{border:1px solid;border-radius:20px;padding:12px 4px;text-align:center;font-weight:700}.stats b{display:block;font-size:1.5em}
.tabs{display:flex;gap:10px;margin:14px 0 0}.tabs button{border-radius:26px 26px 0 0;background:var(--card);color:var(--acc);border:1px solid var(--acc2);box-shadow:none}.tabs .on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on)}
.msg{padding:12px 14px;border-radius:16px;margin:10px 0;background:#2a1519;border:1px solid var(--bad);color:#ffb4a5;word-break:break-word}.msg.ok{background:#0e2a1c;border-color:var(--ok);color:#9ff0c6}
.tag{color:var(--mute);font-size:.88em}.in{color:var(--ok)}.out{color:var(--bad)}
code{direction:ltr;display:inline-block;background:#0004;padding:2px 10px;border-radius:10px;user-select:all}
.banner{margin-top:calc(env(safe-area-inset-top) + 10px);border-radius:0 0 44px 0;border-radius:30px 30px 44px 44px;height:210px;background:radial-gradient(circle at 70% 30%,#0e5a73,#071c28);display:flex;align-items:center;justify-content:center;gap:16px;font-size:44px;overflow:hidden}
.banner img,.banner svg{height:150px;max-width:55%;object-fit:contain}
.title{font-size:3em;font-weight:900;text-align:center;line-height:1.2;margin:10px 0 0}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 90px);inset-inline-start:calc(50% - 250px);display:grid;gap:12px}
.fab a,.fab button{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;text-decoration:none;padding:0}
.fab a{background:#25d366;border:3px solid #fff;box-shadow:0 0 20px #25d36680;color:#fff}.fab button{background:#000;color:#fff;border:1px solid #555;font-size:22px}
@media(max-width:540px){.fab{inset-inline-start:auto;inset-inline-end:14px}}
.dr{position:fixed;inset:0;background:#000a;z-index:9;display:flex}.dr>div{width:78%;max-width:380px;background:#26282b;border-inline-start:3px solid var(--acc2);padding:calc(env(safe-area-inset-top) + 30px) 24px;text-align:center;overflow:auto}
.dr .av{width:110px;height:110px;font-size:60px;margin:0 auto 12px}.dr .it{background:none;color:var(--txt);box-shadow:none;text-align:start;font-size:1.1em;padding:18px 6px}.dr .lo{background:#3d1f22;border:1px solid #7a2020;color:#ff5a3c;box-shadow:none;margin-top:20px}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sw button{box-shadow:none;border:2px solid transparent;padding:12px 4px;font-size:.9em}.sw .cur{border-color:#fff}
.wheel{width:230px;height:230px;margin:16px auto;border-radius:50%;border:10px solid var(--acc2);background:conic-gradient(var(--acc) 0 45deg,#3b0716 45deg 90deg,var(--acc) 90deg 135deg,#3b0716 135deg 180deg,var(--acc) 180deg 225deg,#3b0716 225deg 270deg,var(--acc) 270deg 315deg,#3b0716 315deg);position:relative;transition:transform 3s cubic-bezier(.2,.8,.2,1)}
.wheel::after{content:"أدر";position:absolute;inset:34% ;background:#fff;color:#000;border-radius:50%;display:grid;place-items:center;font-weight:900}
.ptr{position:relative;height:0}.ptr::before{content:"▼";position:absolute;top:2px;left:50%;transform:translateX(-50%);color:var(--ok);font-size:34px;z-index:2}
input,select,textarea{background-image:linear-gradient(180deg,rgba(255,255,255,.07),transparent 55%),linear-gradient(110deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);background-size:100% 100%,250% 100%;background-position:0 0,120% 0;background-repeat:no-repeat;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 14px color-mix(in srgb,var(--acc2) 14%,transparent);transition:box-shadow .3s,border-color .3s}
input:focus,select:focus,textarea:focus{border-color:var(--acc2);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 20px color-mix(in srgb,var(--acc2) 45%,transparent);animation:sheen 1.2s ease}
@keyframes sheen{from{background-position:0 0,120% 0}to{background-position:0 0,-30% 0}}
@media(prefers-reduced-motion:reduce){input:focus,select:focus,textarea:focus{animation:none}}
.pw{position:relative}.pw input{padding-inline:52px}.eye2{position:absolute;top:50%;inset-inline-end:12px;transform:translateY(-50%);background:none;box-shadow:none;width:auto;padding:6px;font-size:1.25em;color:var(--txt)}
[dir=ltr] .mn{left:auto;right:16px}[dir=ltr] .bdg{right:auto;left:-6px}
.bdg{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:12px;min-width:22px;height:22px;font-size:.7em;display:grid;place-items:center;padding:0 5px}.hd{position:relative}.mn{position:absolute;top:calc(100% - 6px);left:16px;z-index:9;background:var(--head);border:1px solid var(--acc2);border-radius:18px;padding:6px;min-width:210px;box-shadow:0 10px 30px #000a}
.mn button{background:none;color:var(--txt);box-shadow:none;text-align:start;padding:12px 14px;border-radius:12px}.mn button:hover{background:#ffffff12}.mnb{position:fixed;inset:0;z-index:8}
button:disabled{cursor:not-allowed}.doc p{margin:.5em 0}.doc b{color:var(--acc)}
#ld{display:none;position:fixed;inset:0;z-index:99;background:rgba(10,0,4,.82);backdrop-filter:blur(2px);flex-direction:column;align-items:center;justify-content:center;gap:26px;color:var(--acc);font-size:1.5em;font-weight:900}
.sp{width:80px;height:80px;border-radius:50%;border:6px solid #ffffff18;border-top-color:var(--acc);animation:spin .9s linear infinite;box-shadow:0 0 30px color-mix(in srgb,var(--acc2) 35%,transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
@media print{body *{visibility:hidden}#stm,#stm *{visibility:visible}#stm{position:absolute;inset:0;color:#000}}
</style>
</head>

const EDGE=/^((?:[^\p{L}\p{N}()\p{M}]|[\uFE0F\u200D\u2139])*)([\s\S]*?)((?:[^\p{L}\p{N}()\p{M}]|[\uFE0F\u200D\u2139])*)$/u;
const fp=x=>x.replace(/؟/g,'?').replace(/،/g,',');
function core(k){
 if(EN[k]!==undefined)return EN[k];
 for(const [r,v] of RX)if(r.test(k))return k.replace(r,v);
 for(const sp of [' | ',' · '])if(k.includes(sp)){const ps=k.split(sp);if(ps.some(p=>/[\u0600-\u06FF]/.test(p)))return ps.map(p=>tr(p)).join(sp)}
 return null}
function tr(s){if(LANG()!=='en'||!s)return s;const m=s.match(EDGE);if(!m||!m[2])return s;const o=core(m[2]);return o===null?s:fp(m[1])+o+fp(m[3])}
function trDom(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
 if(root.querySelectorAll)root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e=>['placeholder','aria-label','title'].forEach(a=>{const v=e.getAttribute(a);if(v){const t=tr(v);if(t!==v)e.setAttribute(a,t)}}))}

async function raw(p,body){for(let i=0;;i++){let r,t;try{r=await fetch(API_BASE+'/api/'+p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.token},body:body?JSON.stringify({...body,deviceId:dev}):undefined});t=await r.text()}catch(e){if(!body&&i<12){await sleep(6000);continue}throw e}

<p><b>5. شراء الكروت:</b> تُسلَّم الأكواد فور تأكيد الشراء ولا يمكن استرجاعها أو استبدالها بعد التسليم. تأكد من الباقة والكمية قبل التأكيد.</p>
<p><b>6. السلفة:</b> خدمة 1000 ريال تتوفر إذا كانت آخر معاملة لك (شراء أو شحن) 5000 ريال أو أكثر، وبشرط عدم وجود سلفة سابقة غير مسددة. يُخصم المبلغ تلقائياً عند أول عملية شحن.</p>
<p><b>7. عجلة الحظ:</b> محاولة واحدة كل 24 ساعة. الجوائز رصيد داخل التطبيق فقط ولا تُصرف نقداً.</p>
<p><b>8. الاستخدام المحظور:</b> يُمنع التلاعب أو محاولة اختراق التطبيق أو إنشاء حسابات متعددة، وللإدارة إيقاف الحساب وإلغاء أي رصيد ناتج عن مخالفة.</p>
<p><b>9. الخصوصية:</b> نحفظ بريدك ورقم هاتفك واسمك وسجل عملياتك لتشغيل الخدمة فقط، ولا نشاركها مع أي جهة أخرى.</p>
<p><b>10. الدعم والتعديل:</b> للتواصل أرسل تذكرة من صفحة الدعم الفني. يحق للإدارة تعديل هذه الشروط، واستمرارك في الاستخدام يعني موافقتك على التعديل.</p></div>`},
about(){return `<div class="box doc"><h2>ℹ️ حول التطبيق</h2><p style="text-align:center">${esc(CFG.name)} · الإصدار 1.0</p>
<p>محفظة رقمية لشراء كروت الباقات وإدارة رصيدك بسهولة. هذه مزايا التطبيق:</p>
<p><b>🛒 متجر الباقات:</b> تصفح الباقات بخصم 10% مع عدد الكروت المتوفرة. ابحث عن باقة، وأضف المفضلة بالنجمة، وحدّد الكمية (1 أو أكثر). يتحقق السيرفر من رصيدك والمخزون، ثم تظهر شاشة تأكيد وبعدها شاشة الكود مع زر النسخ.</p>
<p><b>💳 سجل كروتي:</b> يحفظ كل الكروت التي اشتريتها، مع زر لنسخ الكل.</p>
<p><b>➕ شحن الرصيد:</b> حوّل المبلغ ثم أرسل إشعار التحويل بالمبلغ بالضبط، وتضيفه الإدارة لرصيدك بعد المراجعة.</p>
<p><b>💸 تحويل رصيد:</b> أرسل جزءاً من رصيدك لحساب آخر برقم هاتفه فوراً.</p>
<p><b>💰 خدمة سلفني:</b> سلفة طارئة 1000 ريال تُخصم تلقائياً عند أول شحن. تظهر لك حالتك قبل الطلب (مؤهل، أو عليك سلفة سابقة)، ويعرض السجل سلفك السابقة.</p>
<p><b>🎡 عجلة الحظ:</b> جرّب حظك مرة كل 24 ساعة واربح رصيداً مجانياً، مع عدّاد تنازلي للمحاولة القادمة.</p>
<p><b>📝 كشف الحساب:</b> سجل كامل لحركاتك (شراء، شحن، تحويل، سلف، جوائز) مع تصفية بالتاريخ، وإجمالي الوارد والمنصرف، وتصدير إكسل وطباعة.</p>
<p><b>🎫 الدعم الفني:</b> اكتب عنوان المشكلة وتفاصيلها وأرسلها، وسيرد عليك المطوّر في نفس التذكرة.</p>
<p><b>⚙️ الإعدادات والثيمات:</b> غيّر الثيم والألوان وحجم الخط واسم التطبيق والشعار بما يناسبك.</p>
<p><b>🔒 الأمان:</b> الدخول بالبريد والاسم الرباعي، وكل حساب مرتبط بجهاز واحد، وجميع العمليات تُنفَّذ وتُتحقق في السيرفر.</p>
<p><b>👀 دخول زائر:</b> تصفح الباقات والأسعار دون حساب (للتصفح فقط).</p></div>`},
async notifs(){const r=await api('notifs');S.user.unread=0;const L=r.list||[];return `<div class="box"><h2>🔔 الإشعارات</h2>${L.length?L.map(n=>`<div class="row" style="align-items:flex-start"><span style="flex:1">${n.to===null?'📢':'🔔'} ${esc(n.text)}</span><span class="tag">${n.at.slice(0,16).replace('T',' ')}</span></div>`).join(''):'<p class="tag" style="text-align:center">لا توجد إشعارات.</p>'}</div>`},
async users(){const r=await api('admin/users');S.ul=r.list||[];return `<div class="box"><h2>👥 جميع المستخدمين (${S.ul.length})</h2><input id="uq" placeholder="🔍 بحث بالاسم أو الرقم أو البريد" oninput="S.uq=this.value;drawUsers()" value="${esc(S.uq||'')}"><div id="ul">${usersHtml()}</div></div>`},
async admin(){const [r,t]=await Promise.all([api('admin/pending'),api('admin/tickets')]);const P=r.list||[],T=t.list||[];return `<div class="box"><h2>📢 إرسال إشعار لجميع المستخدمين</h2><textarea id="bn" rows="3" maxlength="500" style="text-align:start" placeholder="اكتب نص الإشعار..."></textarea><button onclick="act('admin/notify',{text:val('bn')},'admin')">إرسال للجميع</button><button class="ghost" style="margin-top:10px" onclick="go('users')">👥 جميع المستخدمين</button></div><div class="box"><h2>طلبات الشحن المعلقة</h2>${P.length?P.map(x=>`<div class="row"><button class="sm" onclick="act('admin/approve',{id:${x.id}},'admin')">اعتماد</button><span>${esc(x.name)}<br><span class="tag">${esc(x.phone)} · ${money(x.amount)} ريال</span></span></div>`).join(''):'<p class="tag" style="text-align:center">لا توجد طلبات.</p>'}</div><div class="box"><h2>🎫 تذاكر الدعم</h2>${T.length?T.map(k=>`<div style="border-bottom:1px solid var(--line);padding:10px 0"><b>${esc(k.title)}</b><div class="tag">${esc(k.name)} · ${esc(k.phone)} · ${k.at.slice(0,16).replace('T',' ')}</div><p>${esc(k.body)}</p>${k.replies.map(x=>`<div class="msg ok">رددت: ${esc(x.text)}</div>`).join('')}<textarea id="r${k.id}" rows="2" style="text-align:start" placeholder="اكتب ردك..."></textarea><button class="sm" onclick="act('admin/reply',{id:${k.id},text:val('r${k.id}')},'admin')">إرسال الرد</button></div>`).join(''):'<p class="tag" style="text-align:center">لا توجد تذاكر.</p>'}</div><div class="box"><h2>إضافة كروت</h2><select id="ap">${[100,200,300,500,1000,2000,3000,5000,10000].map(p=>`<option>${p}</option>`).join('')}</select><textarea id="cs" rows="5" dir="ltr" placeholder="كرت في كل سطر"></textarea><button onclick="act('admin/cards',{pkg:val('ap'),codes:val('cs')},'admin')">إضافة</button></div>`},
settings(){const u=S.user,cur={...PRESETS[CFG.preset],...CFG.over};
const ci=(k,l)=>`<label class="tag">${l}<input type="color" value="${cur[k]}" onchange="setColor('${k}',this.value)"></label>`;
return `<div class="box"><h2>⚙️ إعدادات الحساب</h2><label class="tag">البريد الإلكتروني (لا يمكن تعديله)</label><input value="${esc(u.email)}" disabled dir="ltr"><label class="tag">رقم الهاتف</label><input value="${esc(u.phone)}" disabled dir="ltr"><label class="tag">الاسم الرباعي</label><input id="pn" value="${esc(u.name)}"><input id="pnp" type="password" placeholder="كلمة المرور الحالية لتأكيد تغيير الاسم"><button onclick="saveName()">حفظ الاسم</button><p class="tag">الاسم الرباعي هو مفتاح دخولك، فاحفظه كما كتبته بفواصله ونقاطه. أي تلاعب فيه يعرّضك للحظر 5 دقائق.</p></div>
<div class="box"><h2>🔑 تغيير كلمة المرور</h2><input id="op" type="password" placeholder="كلمة المرور الحالية"><input id="np" type="password" placeholder="كلمة المرور الجديدة"><input id="np2" type="password" placeholder="تأكيد كلمة المرور الجديدة"><button onclick="savePw()">تغيير كلمة المرور</button></div>
<div class="box"><h2>🛡️ التفضيلات</h2><label class="row"><span>إخفاء الرصيد افتراضياً عند فتح التطبيق</span><input type="checkbox" ${CFG.hide!==false?'checked':''} onchange="CFG.hide=this.checked;saveCfg()"></label></div>
<div class="box"><h2>🌐 اللغة / Language</h2><div class="grid"><button class="${LANG()==='ar'?'':'ghost'}" onclick="setLang('ar')">العربية</button><button class="${LANG()==='en'?'':'ghost'}" onclick="setLang('en')">English</button></div></div>
<div class="box"><h2>🎨 التحكم في الثيم</h2><div class="sw">${Object.entries(PRESETS).map(([k,p])=>`<button class="${CFG.preset===k&&!Object.keys(CFG.over).length?'cur':''}" style="background:linear-gradient(135deg,${p.acc},${p.acc2});color:${p.on}" onclick="setPreset('${k}')">${p.n}</button>`).join('')}</div>
<h2 style="font-size:1em;margin-top:18px">ألوان مخصصة</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${ci('acc','لون التمييز')}${ci('bg','الخلفية')}${ci('card','البطاقات')}${ci('head','الشريط العلوي')}</div>
<label class="tag">حجم الخط: ${CFG.fs}<input type="range" min="14" max="20" value="${CFG.fs}" oninput="CFG.fs=+this.value;saveCfg()" onchange="render()"></label></div>
<div class="box"><h2>🖼️ الشعار والاسم</h2><input id="an" value="${esc(CFG.name)}" placeholder="اسم التطبيق" onchange="CFG.name=this.value||'محفظتي';saveCfg()"><input type="file" accept="image/*" onchange="setLogo(this.files[0])"><p class="tag" style="text-align:center">ارفع شعارك الخاص (يُحفظ على هذا الجهاز).</p><button class="ghost" onclick="CFG.logo='';saveCfg();render()">إزالة الشعار</button></div>
<button class="ghost" onclick="CFG={preset:'gold',over:{},logo:'',name:'محفظتي',fs:16};saveCfg();render()">↺ استعادة الإعدادات الافتراضية</button>`}
};
function setLang(l){CFG.lang=l;saveCfg();render()}
function setPreset(k){CFG.preset=k;CFG.over={};saveCfg();render()}
function setColor(k,v){CFG.over[k]=v;if(k==='acc')CFG.over.acc2=shade(v,-35);saveCfg();render()}
function setLogo(f){if(!f)return;const r=new FileReader();r.onload=()=>{CFG.logo=r.result;saveCfg();render()};r.readAsDataURL(f)}
const stats=t=>{const i=t.filter(x=>INC.includes(x.type)).reduce((a,x)=>a+x.amount,0),o=t.filter(x=>!INC.includes(x.type)).reduce((a,x)=>a+x.amount,0);return `<div class="stats"><div style="color:var(--acc);border-color:var(--acc2)">الرصيد الحالي<b>${money(S.user.balance)}</b></div><div class="out" style="border-color:var(--bad)">إجمالي المنصرف<b>${money(o)}</b></div><div class="in" style="border-color:var(--ok)">إجمالي الوارد<b>${money(i)}</b></div></div>`};
async function filt(){const r=await api(`statement?from=${val('f')}&to=${val('t')}`);S.txs=r.txs;$('#stm').innerHTML=stats(r.txs)+stm(r.txs)}
function csv(){const rows=[['النوع','البيان','المبلغ','التاريخ'].map(tr),...S.txs.map(x=>[tr(typeName[x.type]),tr(x.note),x.amount,x.at])];const b=new Blob(['\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='statement.csv';a.click()}
function ask(id){if(!S.token){flash('سجّل الدخول أولاً للشراء');return render()}const q=parseInt(val('q'+id),10),p=S.pk.find(x=>x.id===id);if(!(q>=1)){flash('الكمية يجب أن تكون 1 أو أكثر');return render()}S.pend={id,q,label:p.label,total:p.price*q};go('confirm')}
async function confirmBuy(){const p=S.pend,r=await api('buy',{pkg:p.id,qty:p.q});if(r.ok){S.bought={id:p.id,codes:r.codes};S.pend=null;await refresh();go('bought')}else{flash(r.msg);S.view='store';render()}}
function cp(t){const ok=()=>{flash('تم النسخ ✅',true);render()};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,ok);else{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();ok()}}
async function sendTicket(){const r=await api('ticket',{title:val('tt'),body:val('tb')});flash(r.msg,r.ok);render()}
async function act(p,body,back){const r=await api(p,body);flash(r.msg,r.ok);if(r.ok)await refresh();if(back)S.view=back;render()}
function cdStart(){clearInterval(S.ti);const end=Date.now()+S.wl;const tick=()=>{const l=end-Date.now(),c=$('#cd'),b=$('#sb');if(!c){clearInterval(S.ti);return}if(l<=0){c.textContent='🎉 العجلة جاهزة! جرّب حظك الآن';b.disabled=false;b.style.opacity=1;clearInterval(S.ti);return}const h=Math.floor(l/36e5),m=Math.floor(l%36e5/6e4),x=Math.floor(l%6e4/1e3);c.textContent='⏳ الدوران القادم بعد '+[h,m,x].map(n=>String(n).padStart(2,'0')).join(':');b.disabled=true;b.style.opacity=.5};tick();S.ti=setInterval(tick,1000)}
async function spin(){const r=await api('wheel',{});if(r.ok){const w=$('#wh');w.style.transform=`rotate(${1440+Math.floor(Math.random()*360)}deg)`;await new Promise(z=>setTimeout(z,3000));await refresh()}flash(r.ok?(r.prize?`ربحت ${r.prize} ريال 🎉`:'حظاً أوفر غداً'):r.msg,r.ok);render()}
const usersHtml=()=>{const q=(S.uq||'').trim().toLowerCase();return (S.ul||[]).filter(u=>!q||(u.name+u.phone+u.email).toLowerCase().includes(q)).map(u=>`<div style="border-bottom:1px solid var(--line);padding:12px 0"><b>${esc(u.name)}</b> ${u.role==='admin'?'<span class="tag">(مطوّر)</span>':''}${u.banned?'<span class="out"> ⛔ محظور</span>':''}<div class="tag" dir="ltr" style="text-align:start">${esc(u.phone)} · ${esc(u.email)}</div><div class="tag">الرصيد: ${money(u.balance)} ريال${u.banned?' · السبب: '+esc(u.banned.reason):''}</div>${u.role==='admin'?'':`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button class="ghost sm" onclick="notifyUser(${u.id})">🔔 تنبيه</button>${u.banned?`<button class="grn sm" onclick="banUser(${u.id},1)">✅ رفع الحظر</button>`:`<button class="sm" style="background:var(--bad);color:#fff" onclick="banUser(${u.id})">⛔ حظر</button>`}</div>`}</div>`).join('')||'<p class="tag">لا توجد نتائج.</p>'};
const drawUsers=()=>$('#ul').innerHTML=usersHtml();
async function notifyUser(id){const t=prompt(tr('نص التنبيه للمستخدم:'));if(t)await act('admin/notify',{uid:id,text:t},'users')}
async function banUser(id,un){let reason='';if(!un){reason=prompt(tr('سبب الحظر (سيظهر للمستخدم):'));if(!reason)return}await act('admin/ban',{uid:id,reason,unban:!!un},'users')}
async function saveName(){const r=await api('profile',{name:val('pn'),password:val('pnp')});flash(r.msg,r.ok);render()}
async function savePw(){const r=await api('password',{old:val('op'),password:val('np'),confirm:val('np2')});flash(r.msg,r.ok);render()}
function banView(){const b=S.ban,t=b.code==='BAN';return `<div class="title gt" style="margin-top:calc(env(safe-area-inset-top) + 40px)">${esc(CFG.name)}</div><div class="box" style="text-align:center"><div style="font-size:70px">⛔</div><h2>${t?'تم حظرك مؤقتاً':'تم حظر حسابك'}</h2><div class="msg">${esc(b.msg)}</div>${t?'<div class="pr" id="bc" dir="ltr" style="font-size:2em"></div>':''}<button class="ghost" ${t?'id="bb" disabled style="opacity:.5"':''} onclick="S.ban=null;render()">رجوع</button></div>`}
function banStart(){clearInterval(S.bi);const end=S.ban.t+S.ban.left*1000;const tick=()=>{const l=Math.max(0,Math.ceil((end-Date.now())/1000)),c=$('#bc'),b=$('#bb');if(!c){clearInterval(S.bi);return}c.textContent=String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0');if(!l){clearInterval(S.bi);b.disabled=false;b.style.opacity=1;c.textContent='انتهى الحظر ✅'}};tick();S.bi=setInterval(tick,1000)}
async function render(){theme();const app=$('#app');
 if(S.ban){app.innerHTML=banView();if(S.ban.code==='BAN')banStart();return}
 if(!S.token&&S.guest){S.view='store';app.innerHTML=`<div style="height:calc(env(safe-area-inset-top) + 16px)"></div><div class="top" style="display:flex;justify-content:space-between;align-items:center;margin:10px 0"><b>وضع الزائر (تصفح فقط)</b><button class="ghost sm" onclick="S.guest=false;render()">دخول</button></div>${msgHtml()}`+await views.store();return}
 if(!S.token)return app.innerHTML=authView();
 await refresh();if(S.ban)return render();
 if(!S.user)return app.innerHTML=authView();
 const html=await views[S.view]();if(S.ban)return render();
 app.innerHTML=shell(html);window.scrollTo(0,0);if(S.view==='wheel')cdStart();else clearInterval(S.ti)}
new MutationObserver(()=>document.querySelectorAll('input[type=password]').forEach(i=>{if(i.parentElement.classList.contains('pw'))return;const w=document.createElement('div');w.className='pw';i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement('button');b.type='button';b.className='eye2';b.textContent='👁️';b.setAttribute('aria-label','إظهار أو إخفاء كلمة المرور');b.onclick=()=>{const h=i.type==='password';i.type=h?'text':'password';b.textContent=h?'🙈':'👁️'};w.appendChild(b)})).observe(document.body,{childList:true,subtree:true});
new MutationObserver(ms=>{if(LANG()!=='en')return;ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)trDom(n);else if(n.nodeType===3){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}}))}).observe(document.body,{childList:true,subtree:true});
render();
</script>
</body>
</html>
